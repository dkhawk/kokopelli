<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kokopelli Live Tracker</title>
    <link rel="stylesheet" href="/style.css" />
    <!-- Load Google Maps API with v=alpha to support 3D Maps Web Components -->
    <script async
      src="https://maps.googleapis.com/maps/api/js?key=%VITE_GOOGLE_MAPS_API_KEY%&v=alpha&libraries=maps3d,marker">
    </script>
  </head>
  <body>
    <div id="app">
      <header class="tracker-header">
        <h1>Kokopelli Live Tracker</h1>
        <div class="stats">
          <input type="file" id="route-file-input" accept=".gpx,.kml" style="display: none;">
          <button id="open-route-btn" style="padding: 0.2rem 1rem; margin-right: 0.5rem; width: auto; font-size: 0.9rem;">Open Local</button>
          <div class="drive-select-container">
            <select id="drive-route-select" class="styled-select-drive" style="display: none;">
              <option value="" disabled selected>Loading races...</option>
            </select>
            <span id="drive-status" class="drive-status-msg">☁️ Connecting Drive...</span>
          </div>
          <span id="elapsed-time">00:00:00</span>
          <span id="distance">0.0 km</span>
          <span id="elevation">Elev: 0 m</span>
          <span id="next-aid-status" style="color: var(--accent-color);">Next: N/A</span>
          <button id="settings-btn" class="icon-btn" title="Settings">⚙️</button>
        </div>
      </header>

      <div class="map-container">
        <!-- 3D Map Container -->
      <gmp-map-3d id="map-3d" mode="satellite" center="41.72852,-111.79962,3000" tilt="67" range="5000" heading="45"></gmp-map-3d>
      </div>
      
      <div class="overlay-panel" id="control-panel">
        <h1 style="margin-bottom: 0.5rem;">Bighorn 52 Telemetry</h1>
        <div class="playback-controls-bar">
          <button id="btn-rev" class="icon-btn ctrl-btn" title="Reverse">⏪</button>
          <button id="btn-slower" class="icon-btn ctrl-btn" title="Slower">➖</button>
          <button id="btn-play" class="icon-btn ctrl-btn" title="Play/Pause">▶</button>
          <button id="btn-faster" class="icon-btn ctrl-btn" title="Faster">➕</button>
        </div>
        <div id="speed-readout" style="text-align: center; margin-top: 0.5rem; font-family: monospace; color: var(--accent-color);">Speed: 1x</div>
        <div style="margin-top: 1rem; text-align: center;">
          <label for="camera-range-slider" style="font-size: 0.8rem; color: #94a3b8; display: block; margin-bottom: 0.2rem;">Camera Range</label>
          <input type="range" id="camera-range-slider" min="1000" max="50000" value="8000" style="width: 100%;">
        </div>
      </div>

      <div class="overlay-panel right-panel" id="aid-info-panel" style="display: none;">
        <h2 id="aid-name">Aid Station</h2>
        <p id="aid-desc" class="desc">What to expect...</p>
        <div class="aid-stats">
          <div class="stat-row"><span>Total Distance:</span> <strong id="aid-total">0</strong></div>
          <div class="stat-row"><span>From Previous:</span> <strong id="aid-prev">0</strong></div>
          <div class="stat-row"><span>To Next:</span> <strong id="aid-next">0</strong></div>
        </div>
        <button id="close-aid-btn" style="margin-top: 1rem; background: var(--text-secondary);">Close</button>
      </div>

      <div class="overlay-panel center-panel" id="settings-panel" style="display: none;">
        <h2>Settings</h2>
        <div class="setting-row">
          <label for="unit-select">Unit System</label>
          <select id="unit-select" class="styled-select">
            <option value="imperial">Imperial (mi, ft)</option>
            <option value="metric">Metric (km, m)</option>
          </select>
        </div>
        <button id="close-settings-btn" style="margin-top: 1rem; background: var(--text-secondary);">Close</button>
      </div>

      <div class="elevation-panel">
        <canvas id="elevation-canvas"></canvas>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
